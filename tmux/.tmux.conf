# Numerar ventanas y paneles desde 1, no desde 0
set -g base-index 1
setw -g pane-base-index 1

# Ratón: seleccionar paneles, redimensionar y hacer scroll
set -g mouse on

# Colores de 24 bits, para que los temas se vean bien
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Recargar la configuración con prefijo + r
bind r source-file ~/.tmux.conf \; display "Configuración recargada"
